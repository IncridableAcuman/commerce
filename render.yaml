services:
  # ============================================================================
  # 1. Backend Web Service (Spring Boot Docker)
  # ============================================================================
  - type: web
    name: commerce-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: ohio
    healthCheckPath: /api/v1/actuator/health
    envVars:
      - key: PORT
        value: 8080
      # Neon.tech Cloud PostgreSQL Connection (Render Secret Environment Variables)
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # JWT Authentication Secrets & Settings
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH
        value: "604800000"
      - key: JWT_ACCESS
        value: "900000"
      # Email SMTP Secrets (Gmail App Password)
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      # Frontend Client URL (CORS & Email links)
      - key: CLIENT_URL
        value: https://commerce-frontend.onrender.com
      # File Uploads Directory
      - key: UPLOAD_DIR
        value: /app/uploads
      # Production JVM Optimization (Render Free 512MB RAM & Metaspace OOM Prevention)
      - key: JAVA_OPTS
        value: "-XX:+UseSerialGC -Xms64m -Xmx220m -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=24m -Xss256k -Djava.security.egd=file:/dev/./urandom -Dfile.encoding=UTF-8"
      # Infrastructure Feature Flags
      - key: ELASTICSEARCH_ENABLED
        value: "false"
      - key: RABBITMQ_ENABLED
        value: "false"
      - key: SHOW_SQL
        value: "false"

  # ============================================================================
  # 2. Frontend Static Site (React Vite SPA)
  # ============================================================================
  - type: web
    name: commerce-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://commerce-backend.onrender.com/api/v1
