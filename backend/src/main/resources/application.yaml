server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
      show-sql: true
      properties:
        format-sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  redis:
    host: ${REDIS_HOST:localhost}
    port: 6379
  data:
    rabbitmq:
      host: ${RABBITMQ_HOST:localhost}
      port: 5672
    elasticsearch:
      repositories:
        enabled: ${ELASTICSEARCH_ENABLED:false}
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:google-client-secret}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"


jwt:
  secret: ${JWT_SECRET}
  refresh_time: ${JWT_REFRESH}
  access_time: ${JWT_ACCESS}

file:
  upload:
    dir: ${UPLOAD_DIR:./uploads}

client:
  url: ${CLIENT_URL:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true