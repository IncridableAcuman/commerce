server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: backend
  datasource:
    url: ${DB_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/commerce}}
    username: ${DB_USERNAME:admin2003}
    password: ${DB_PASSWORD:admin2003}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
    elasticsearch:
      repositories:
        enabled: ${ELASTICSEARCH_ENABLED:false}
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:${RABBITMQ_USERNAME:guest}}
    password: ${RABBITMQ_PASS:${RABBITMQ_PASSWORD:guest}}
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:google-client-secret}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

jwt:
  secret: ${JWT_SECRET:uzbekistan_uzbekistan_0123456789}
  refresh_time: ${JWT_REFRESH:604800000}
  access_time: ${JWT_ACCESS:900000}

file:
  upload:
    dir: ${UPLOAD_DIR:./uploads}

client:
  url: ${CLIENT_URL:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    db:
      enabled: true
    rabbit:
      enabled: false
    redis:
      enabled: false
    mail:
      enabled: false