plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.1' // Yoki o'zingiz tanlagan barqaror 3.x/4.x versiya
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.commerce'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Core & Web Starters
	implementation 'org.springframework.boot:spring-boot-starter-webmvc' // 'spring-boot-starter-web' bilan bir xil
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-mail'

	// Database & Cache
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-session-data-redis'
	runtimeOnly 'org.postgresql:postgresql'

	// Security & OAuth2
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'

	// Messaging (RabbitMQ)
	implementation 'org.springframework.boot:spring-boot-starter-amqp'

	// Utilities & Configuration
	implementation 'org.springframework.boot:spring-boot-starter-restclient' // Spring Boot 3.4+ uchun rasmiy starter
	implementation 'me.paulschwarz:spring-dotenv:4.0.0'

	// JWT (JSON Web Token) - Yangi versiyalarga mos keluvchi 0.12.x seriyasi tavsiya etiladi
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// DevTools
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// --- TEST DEPENDENCIES (TO'G'RILANDI) ---
	// Universal Spring Boot Test starter (JPA, Mail, Redis, Validation va Web testlarini o'z ichiga oladi)
	testImplementation 'org.springframework.boot:spring-boot-starter-test'

	// Alohida maxsus test paketlari
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.test.rabbitmq:spring-rabbit-test' // AMQP test uchun to'g'ri nomi

	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
